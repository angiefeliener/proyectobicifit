<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro BICIFIT</title>
    <link rel="stylesheet" href="estilo.css"> 
</head>
<body>

<div class="container">
    <div class="register-container">
        <div class="image-section">
            <img src="/imagenes/fondo.jpeg" alt="Bicifit Fitness Shop Logo" class="logo">
        </div>
        <div class="form-section">
            <h2>REGISTRARTE</h2>
            <p>Crea tu cuenta. Es gratis y solo te llevará un minuto.</p>
            <form>
                <input type="text" placeholder="NOMBRE" required>
                <input type="text" placeholder="APELLIDO" required>
                <input type="text" placeholder="NUMERO CELULAR" required>
                <input type="email" placeholder="CORREO ELECTRÓNICO" required>
                <input type="password" placeholder="CONTRASEÑA" required>
                <button type="submit">REGISTRARTE</button>
            </form>
        </div>
    </div>
</div>

</body>
</html>
