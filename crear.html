<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Bicifit</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        
        <div class="logo-container">
            <img src="/imagenes/logopeng.jpeg" alt="Bicifit Fitness Shop Logo" class="logo">
        </div>
        
        <div class="login-box">
            <form action="crear.html" method="POST">
                <label for="email">Correo electrónico:</label>
                <input type="email" id="email" name="email" placeholder="Ingresa tu correo" required>
                
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña" required>
                
                <button type="submit">Aceptar</button>
            </form>

          
            <div class="extras">
                <p>¿No tienes una cuenta? <a href="registro.html">¡Crea una!</a></p>
                <p><a href="recuperar_cont.html">¿Olvidaste tu contraseña?</a></p>
            </div>
        </div>
    </div>
</body>
</html>
