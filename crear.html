<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Bici Fit</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="Pricipal.html">Inicio</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="Accesorio.html">Accesorios</a></li>
                <li><a href="carrito.html">Carrito</a></li>
                <li><a href="login.html" class="active">Login</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="login-container">
            <div class="login-image">
                <img src="/imagenes/logopeng.jpeg" alt="Imagen de Login">
            </div>
            <div class="login-form">
                <h1>Iniciar Sesión</h1>
                <form action="procesar-login.php" method="POST">
                    <label for="email">Correo Electrónico:</label>
                    <input type="email" id="email" name="email" placeholder="Ingresa tu correo" required>
                    
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña" required>
                    
                    <button type="submit">Iniciar Sesión</button>
                </form>
                <p>¿Olvidaste tu contraseña? <a href="recuperar.html">Recupérala aquí</a></p>
                <p>¿No tienes una cuenta? <a href="registro.html">Regístrate</a></p>
            </div>
        </div>
    </main>
